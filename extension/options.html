<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Focus OS - Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 20px;
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #6b7280;
      font-size: 14px;
    }
    .section {
      margin-bottom: 30px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 500;
      color: #374151;
      margin-bottom: 4px;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-right: 8px;
    }
    .button:hover {
      background: #2563eb;
    }
    .button-secondary {
      background: #f3f4f6;
      color: #1f2937;
    }
    .button-secondary:hover {
      background: #e5e7eb;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .status-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }
    .blocked-domains-list {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px;
      margin-top: 8px;
    }
    .domain-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }
    .remove-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Focus OS Settings</div>
    <div class="subtitle">Configure your deep work environment</div>
  </div>

  <div id="status" class="status status-success" style="display: none;">
    Settings saved successfully!
  </div>

  <div class="section">
    <h2 class="section-title">Focus Mode Settings</h2>
    
    <div class="form-group">
      <label for="warningDelay">Warning Delay (ms)</label>
      <input type="number" id="warningDelay" value="5000">
      <small>Time before showing warning on distracting sites</small>
    </div>

    <div class="form-group">
      <label for="autoCloseDelay">Auto-Close Delay (ms)</label>
      <input type="number" id="autoCloseDelay" value="10000">
      <small>Time before automatically closing distracting tabs</small>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Blocked Domains</h2>
    
    <div class="form-group">
      <label for="newDomain">Add New Domain</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="newDomain" placeholder="example.com">
        <button class="button" onclick="addDomain()">Add</button>
      </div>
    </div>

    <div class="blocked-domains-list">
      <h3 style="margin-bottom: 8px;">Currently Blocked:</h3>
      <div id="blockedDomainsList"></div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">API Settings</h2>
    
    <div class="form-group">
      <label for="apiUrl">API URL</label>
      <input type="text" id="apiUrl" value="http://localhost:3001">
    </div>

    <div class="form-group">
      <label for="apiKey">API Key</label>
      <input type="text" id="apiKey" value="02313202e4207fed50089c8e7d99be82c85f3f8f2cc42e9b9d9ebe8b9fca6f3c">
    </div>
  </div>

  <div class="section">
    <button class="button" onclick="saveSettings()">Save Settings</button>
    <button class="button button-secondary" onclick="resetSettings()">Reset to Defaults</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
