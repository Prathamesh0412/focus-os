<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #6b7280;
    }
    .status {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .status-item:last-child {
      margin-bottom: 0;
    }
    .status-label {
      color: #6b7280;
    }
    .status-value {
      font-weight: 500;
      color: #1f2937;
    }
    .status-active {
      color: #059669;
    }
    .status-inactive {
      color: #dc2626;
    }
    .button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .button-primary {
      background: #3b82f6;
      color: white;
    }
    .button-primary:hover {
      background: #2563eb;
    }
    .button-danger {
      background: #ef4444;
      color: white;
    }
    .button-danger:hover {
      background: #dc2626;
    }
    .button-secondary {
      background: #f3f4f6;
      color: #1f2937;
    }
    .button-secondary:hover {
      background: #e5e7eb;
    }
    .current-site {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Focus OS</div>
    <div class="subtitle">Deep Work Operating System</div>
  </div>

  <div id="currentSite" class="current-site" style="display: none;">
    <strong>Current Site:</strong> <span id="currentDomain"></span>
  </div>

  <div class="status">
    <div class="status-item">
      <span class="status-label">Focus Mode:</span>
      <span id="focusModeStatus" class="status-value status-inactive">Inactive</span>
    </div>
    <div class="status-item">
      <span class="status-label">Active Session:</span>
      <span id="sessionStatus" class="status-value status-inactive">None</span>
    </div>
  </div>

  <button id="startFocus" class="button button-primary">Start Focus Mode</button>
  <button id="stopFocus" class="button button-danger" style="display: none;">Stop Focus Mode</button>
  <button id="openDashboard" class="button button-secondary">Open Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
