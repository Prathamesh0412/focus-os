<!DOCTYPE html>
<html>
<head>
  <title>Focus OS - Select Tabs to Keep</title>
  <style>
    body {
      width: 400px;
      height: 500px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      color: #1a1a1a;
    }
    .header p {
      margin: 8px 0 0 0;
      color: #666;
      font-size: 14px;
    }
    .tabs-container {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }
    .tab-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tab-item:hover {
      background: #f5f5f5;
    }
    .tab-item.selected {
      background: #e3f2fd;
    }
    .tab-checkbox {
      margin-right: 12px;
    }
    .tab-info {
      flex: 1;
      min-width: 0;
    }
    .tab-title {
      font-weight: 500;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-url {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #1976d2;
      color: white;
    }
    .btn-primary:hover {
      background: #1565c0;
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    .select-all {
      margin-bottom: 12px;
    }
    .select-all label {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      color: #666;
    }
    .select-all input {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Start Focus Session</h2>
    <p>Select tabs you want to keep open during focus time</p>
  </div>

  <div class="select-all">
    <label>
      <input type="checkbox" id="selectAll">
      <span>Select/Deselect All</span>
    </label>
  </div>

  <div class="tabs-container" id="tabsContainer">
    <!-- Tabs will be populated here -->
  </div>

  <div class="actions">
    <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
    <button class="btn btn-primary" id="startFocusBtn">Start Focus</button>
  </div>

  <script src="tabselector.js"></script>
</body>
</html>
